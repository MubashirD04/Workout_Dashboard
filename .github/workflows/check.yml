name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # Root deps: convex/ resolves `convex`, `svix`, etc. from the root node_modules.
      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      # Client typecheck (tsc -b), full Convex backend typecheck, and ESLint.
      - name: Typecheck and lint
        run: npm run check
